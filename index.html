<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كشف الحضور"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<title>كشف الحضور</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;-webkit-text-size-adjust:100%}
:root{--bg:#eef2f7;--card:#fff;--text:#2c3e50;--tl:#7f8c8d;--bd:#e2e8f0;--pr:#3498db;--gr:#27ae60;--or:#e67e22;--rd:#e74c3c;--pu:#9b59b6;--sh:0 4px 10px rgba(0,0,0,.08)}
body.dark{--bg:#12141a;--card:#1e212b;--text:#ecf0f1;--tl:#95a5a6;--bd:#2c3240;--sh:0 4px 15px rgba(0,0,0,.4)}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);margin:0;padding:12px 12px 90px;color:var(--text);transition:background .3s,color .3s}
.container{max-width:620px;margin:0 auto;background:var(--card);padding:16px;border-radius:14px;box-shadow:var(--sh)}
h1{text-align:center;margin:4px 0 14px;font-size:22px}h3{margin:5px 0 12px;font-size:17px}
label{display:block;margin-bottom:5px;font-weight:bold;font-size:13px}
input[type=text],input[type=number]{width:100%;padding:11px;border:2px solid var(--bd);border-radius:9px;font-size:15px;outline:none;background:var(--bg);font-family:inherit;color:var(--text)}
input:focus{border-color:var(--pr)}
.btn{border:none;border-radius:9px;cursor:pointer;font-size:15px;font-weight:bold;padding:12px;width:100%;transition:.15s;color:#fff}
.btn:active{transform:scale(.98)}
.green{background:var(--gr)}.red{background:var(--rd)}.gray{background:var(--tl)}.wa{background:#25D366}
.banner{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:12px 14px;border-radius:11px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;line-height:1.5}
.banner b{font-size:15px}.banner div{flex:1}
.banner button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;padding:7px 11px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:bold;white-space:nowrap}
.cam{display:none;margin:12px auto;position:relative}.cam.active{display:block}
.cam-n{width:100%;max-width:320px;height:40vh;max-height:300px;margin:0 auto;border-radius:14px;overflow:hidden;border:2px solid var(--rd);background:#000;position:relative}
.cam-n video{width:100%;height:100%;object-fit:cover;display:block}
.cam-n::after{content:'';position:absolute;inset:0;margin:auto;width:52%;aspect-ratio:1;border:2px solid var(--gr);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.cam-s{margin:0 auto;position:relative;width:260px;height:260px}
.glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,128,.4),rgba(0,191,255,.3) 45%,transparent 70%);pointer-events:none;will-change:opacity,transform;animation:gp 2s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.ring{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;will-change:transform;animation:hb 2s ease-in-out infinite}
.ring::before{content:'';position:absolute;inset:0;border-radius:50%;padding:4px;background:conic-gradient(#f00,#ff7f00,#ff0,#0f0,#00f,#4b0082,#9400d3,#f00);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;will-change:transform;animation:rot 4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.cam-in{position:absolute;inset:0;border-radius:50%;background:#000;overflow:hidden;z-index:1;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.cam-in video{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.scan{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:50%;overflow:hidden}
.line{position:absolute;top:24%;will-change:transform,opacity;left:24%;right:24%;height:2px;background:linear-gradient(90deg,transparent,#00ff88,#00ffaa,#00ff88,transparent);box-shadow:0 0 6px #00ff88;animation:sm 2s ease-in-out infinite;border-radius:3px}
@keyframes sm{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(134px);opacity:1}}
.cn{position:absolute;width:18px;height:18px;border:2px solid #00ff88;animation:cp 1.5s ease-in-out infinite}
.cn.a{top:24%;left:24%;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.cn.b{top:24%;right:24%;border-left:0;border-bottom:0;border-radius:0 10px 0 0;animation-delay:.1s}
.cn.c{bottom:24%;left:24%;border-right:0;border-top:0;border-radius:0 0 0 10px;animation-delay:.2s}.cn.d{bottom:24%;right:24%;border-left:0;border-top:0;border-radius:0 0 10px 0;animation-delay:.3s}
@keyframes cp{0%,100%{opacity:.5}50%{opacity:1}}
.hint{position:absolute;bottom:-35px;left:0;right:0;color:#00ff88;font-size:13px;font-weight:bold;text-align:center;animation:pt 1.5s ease-in-out infinite;white-space:nowrap;z-index:5}
@keyframes pt{0%,100%{opacity:.6}50%{opacity:1}}
.add-form{background:rgba(52,152,219,.05);padding:14px;border-radius:11px;margin:30px 0 16px;border:1px solid var(--bd)}
.fg{margin-bottom:11px}.gp{display:flex;gap:8px;margin-bottom:11px}
.go{flex:1;padding:10px;border:2px solid var(--bd);border-radius:9px;cursor:pointer;text-align:center;background:var(--card)}
.go.sel{border-color:var(--gr);background:rgba(39,174,96,.1)}.go img{width:50px;height:50px;border-radius:50%;display:block;margin:0 auto 4px}.go span{font-size:13px;font-weight:bold}
.si{background:var(--bg);padding:10px 12px;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;border:1px solid rgba(39,174,96,.3);gap:8px;background:rgba(39,174,96,.1)}
.si-i{flex-grow:1;display:flex;align-items:center;gap:10px;min-width:0}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bd);flex-shrink:0}
.nm{font-size:15px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ph{font-size:12px;color:var(--tl);margin-top:2px}.tm{font-size:11px;color:var(--or);margin-top:2px;font-weight:bold}
.dots{width:38px;height:38px;border-radius:50%;background:var(--bd);border:none;cursor:pointer;font-size:20px;color:var(--text);font-weight:bold;flex-shrink:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);justify-content:center;align-items:center;z-index:1000;padding:10px}.modal.active{display:flex}
.mc{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--card);padding:18px;border-radius:14px;max-width:420px;width:100%;text-align:center;position:relative;max-height:94vh;overflow-y:auto}
.close-btn{position:absolute;top:8px;left:12px;font-size:22px;cursor:pointer;color:var(--tl);font-weight:bold;z-index:10;background:var(--bg);border:1px solid var(--bd);line-height:1;padding:6px 10px;border-radius:8px}
.mi{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px 15px;margin-bottom:8px;cursor:pointer;text-align:right;font-size:15px;font-weight:bold;display:flex;align-items:center;gap:12px}
.mi span:first-child{font-size:22px}.mi span:nth-child(2){flex:1}
.mi.g{background:rgba(39,174,96,.1);border-color:rgba(39,174,96,.3);color:var(--gr)}.mi.o{background:rgba(230,126,34,.1);border-color:rgba(230,126,34,.3);color:var(--or)}.mi.r{background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.3);color:var(--rd)}.mi.s{background:var(--gr);color:#fff}
.qr{--glow:#00d4ff;width:240px;height:240px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:14px;padding:12px;margin:15px auto;border:3px solid var(--glow);isolation:isolate}
.qr::after{content:'';position:absolute;inset:-8px;border-radius:18px;background:var(--glow);filter:blur(20px);opacity:.5;z-index:-1;pointer-events:none;animation:gp 2s ease-in-out infinite}
.qr-i{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;padding:6px}.qr-i canvas{width:100%!important;height:100%!important;border-radius:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:10000;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
.amt{padding:12px;border-radius:8px;border:2px solid var(--pr);background:rgba(52,152,219,.1);color:var(--pr);font-weight:bold;font-size:16px;cursor:pointer}.amt.sel{background:var(--or);color:#fff;border-color:var(--or)}
.hg{display:inline-block;animation:rot 2s linear infinite;margin-left:5px}
.log{padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:13px;border-right:4px solid var(--gr);background:rgba(39,174,96,.1);text-align:right}.log small{display:block;color:var(--tl);font-size:11px;margin-top:3px}
#lock{display:none;position:fixed;inset:0;z-index:99999;background:rgba(10,12,20,.97);align-items:center;justify-content:center;padding:20px}#lock.on{display:flex}
#lock div{background:var(--card);padding:22px;border-radius:14px;max-width:360px;text-align:center}
#fab{position:fixed;bottom:20px;left:20px;width:55px;height:55px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 15px rgba(102,126,234,.45);z-index:999}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.sc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center}.sc b{display:block;font-size:20px;margin-bottom:4px}.sc small{font-size:12px;color:var(--tl);font-weight:bold}
.okfl{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(46,204,113,.8),rgba(46,204,113,.25) 70%);opacity:0;pointer-events:none;z-index:6}.okfl.go{animation:okf .8s ease-out}@keyframes okf{0%{opacity:.95}100%{opacity:0}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.modal.active .mc{animation:mcin .22s ease-out}@keyframes mcin{from{opacity:0;transform:translateY(12px) scale(.98)}}
button,input{font-family:inherit}.toast{max-width:90vw;text-align:center;line-height:1.6}
body{padding-top:calc(12px + env(safe-area-inset-top))!important;padding-bottom:calc(90px + env(safe-area-inset-bottom))!important}button{touch-action:manipulation}#cameraSmall.active{padding-bottom:34px}
#fab{bottom:calc(20px + env(safe-area-inset-bottom))!important}.toast{bottom:calc(20px + env(safe-area-inset-bottom))!important}
</style>
</head>
<body>
<div class="container">
<h1>📝 إدارة الطلاب</h1>
<div id="banner" class="banner"></div>
<div style="display:flex;gap:8px;margin-bottom:12px"><button id="camBtn" class="btn red" style="font-size:14px;padding:13px;flex:1" onclick="toggleCamera()">📷 مسح الـ QR</button><button class="btn" style="background:var(--pr);font-size:14px;padding:13px;flex:1" onclick="quickCheckIn()">⚡ تسجيل سريع</button></div>
<div id="cameraNormal" class="cam"><div class="cam-n"><video id="videoNormal" playsinline muted autoplay></video><i class="okfl"></i></div></div>
<div id="cameraSmall" class="cam"><div class="cam-s"><div class="glow"></div><div class="ring"></div>
<div class="cam-in"><video id="videoSmall" playsinline muted autoplay></video><div class="scan"><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i><div class="line"></div></div></div>
<i class="okfl" style="border-radius:50%"></i><div class="hint">📸 ضع الكود داخل الإطار</div></div></div>
<div class="add-form"><h3>➕ تسجيل طالب جديد</h3>
<div class="fg"><label>اسم الطالب (ثلاثي):</label><input type="text" id="sName" maxlength="40" placeholder="مثال: عبد الوهاب"></div>
<div class="fg"><label>رقم الموبايل:</label><input type="text" id="sPhone" maxlength="11" inputmode="numeric" placeholder="مثال: 011XXXXXXXX"></div>
<div class="fg"><label>اختر نوع الطالب:</label><div class="gp">
<div class="go" id="gBoy" onclick="pick('boy')"><img id="aBoy"><span>👦 ولد</span></div>
<div class="go" id="gGirl" onclick="pick('girl')"><img id="aGirl"><span>👧 بنت</span></div></div></div>
<button class="btn green" onclick="addStudent()">💾 حفظ الطالب + توليد QR</button></div>
<div id="list" style="margin-top:15px"></div>
</div>
<button id="fab" onclick="openSettings()">⚙️</button>
<div id="m" class="modal"><div class="mc" id="mBody"></div></div>
<div id="lock"><div><h2 style="color:var(--rd);margin-top:0">⚠️ يجب أخذ نسخة احتياطية الآن</h2><p style="font-size:15px;line-height:1.7;font-weight:bold">مرّ شهر على آخر نسخة احتياطية، ولن يعمل البرنامج قبل أخذ نسخة جديدة.</p><p style="font-size:13px;color:var(--tl);line-height:1.7">تتضمن النسخة جميع البيانات منذ بداية استخدام البرنامج وحتى هذه اللحظة. احفظ الملف في مكان آمن خارج المتصفح.</p><button class="btn green" style="padding:15px;margin-bottom:8px" onclick="exportData()">📥 تصدير نسخة احتياطية الآن</button><button class="btn" style="padding:13px;background:var(--pr)" onclick="shareBackup()">🔗 مشاركة النسخة (واتساب / درايف)</button></div></div>
<div id="toast" class="toast"></div>
<script>
/* ===== QR ===== */
const QRLib=(function(){var EC={L:1,M:0,Q:3,H:2},EXP=new Uint8Array(256),LOG=new Uint8Array(256);
(function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D}EXP[255]=1})();
function gmul(a,b){return(a&&b)?EXP[(LOG[a]+LOG[b])%255]:0}
var RS=[[[1,26,19],[1,26,16],[1,26,13],[1,26,9]],[[1,44,34],[1,44,28],[1,44,22],[1,44,16]],[[1,70,55],[1,70,44],[2,35,17],[2,35,13]],[[1,100,80],[2,50,32],[2,50,24],[4,25,9]],[[1,134,108],[2,67,43],[2,33,15,2,34,16],[2,33,11,2,34,12]],[[2,86,68],[4,43,27],[4,43,19],[4,43,15]],[[2,98,78],[4,49,31],[2,32,14,4,33,15],[4,39,13,1,40,14]],[[2,121,97],[2,60,38,2,61,39],[4,40,18,2,41,19],[4,40,14,2,41,15]],[[2,146,116],[3,58,36,2,59,37],[4,36,16,4,37,17],[4,36,12,4,37,13]],[[2,86,68,2,87,69],[4,69,43,1,70,44],[6,43,19,2,44,20],[6,43,15,2,44,16]]];
var AL=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
function blocks(v,ec){var row=RS[v-1][ec===EC.L?0:ec===EC.M?1:ec===EC.Q?2:3],b=[];for(var i=0;i<row.length;i+=3)for(var j=0;j<row[i];j++)b.push([row[i+1],row[i+2]]);return b}
function utf8(s){var o=[],i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(c<0x80)o.push(c);else if(c<0x800)o.push(0xC0|(c>>6),0x80|(c&63));else o.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63))}return o}
function rsEnc(d,eLen){var g=[1];for(var i=0;i<eLen;i++){var ng=new Array(g.length+1).fill(0);for(var j=0;j<g.length;j++){ng[j]^=gmul(g[j],1);ng[j+1]^=gmul(g[j],EXP[i])}g=ng}var b=d.concat(new Array(eLen).fill(0));for(var i=0;i<d.length;i++){var c=b[i];if(c!==0)for(var j=0;j<g.length;j++)b[i+j]^=gmul(g[j],c)}return b.slice(d.length)}
function make(t){var bytes=utf8(t),v=1,i;
for(v=1;v<=10;v++){var b0=blocks(v,EC.M),cap=0;for(i=0;i<b0.length;i++)cap+=b0[i][1];var lb=v<10?8:16;if(bytes.length*8+4+lb<=cap*8)break}
if(v>10)throw new Error('long');
var blk=blocks(v,EC.M),tot=0;for(i=0;i<blk.length;i++)tot+=blk[i][1];
var buf=[],bl=0;function put(val,len){for(var k=len-1;k>=0;k--){if(bl%8===0)buf.push(0);if((val>>k)&1)buf[buf.length-1]|=0x80>>(bl%8);bl++}}
put(4,4);put(bytes.length,v<10?8:16);for(i=0;i<bytes.length;i++)put(bytes[i],8);
var cap=tot*8;if(bl+4<=cap)put(0,4);bl+=4;while(bl%8!==0){bl++;buf[buf.length-1]|=0}while(buf.length<tot){buf.push(0xEC);if(buf.length<tot)buf.push(0x11)}buf=buf.slice(0,tot);
var db=[],eb=[],pos=0;for(i=0;i<blk.length;i++){var dL=blk[i][1],eL=blk[i][0]-blk[i][1],dd=buf.slice(pos,pos+dL);pos+=dL;db.push(dd);eb.push(rsEnc(dd,eL))}
var fb=[],mD=0,mE=0;for(i=0;i<db.length;i++){mD=Math.max(mD,db[i].length);mE=Math.max(mE,eb[i].length)}
for(i=0;i<mD;i++)for(var j=0;j<db.length;j++)if(i<db[j].length)fb.push(db[j][i]);
for(i=0;i<mE;i++)for(var j=0;j<eb.length;j++)if(i<eb[j].length)fb.push(eb[j][i]);
var sz=v*4+17,m=[],r=[];for(i=0;i<sz;i++){m.push(new Array(sz).fill(0));r.push(new Array(sz).fill(false))}
function sm(a,b,c){if(a>=0&&a<sz&&b>=0&&b<sz)m[a][b]=c?1:0}function sr(a,b){if(a>=0&&a<sz&&b>=0&&b<sz)r[a][b]=true}
function fnd(rr,cc){for(var i=-1;i<=7;i++)for(var j=-1;j<=7;j++){var R=rr+i,C=cc+j;if(R<0||R>=sz||C<0||C>=sz)continue;var vv=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);sm(R,C,vv);sr(R,C)}}
fnd(0,0);fnd(0,sz-7);fnd(sz-7,0);
for(i=8;i<sz-8;i++){sm(6,i,i%2===0);sr(6,i);sm(i,6,i%2===0);sr(i,6)}
var ap=AL[v-1];for(i=0;i<ap.length;i++)for(var j=0;j<ap.length;j++){var rr=ap[i],cc=ap[j];if(r[rr][cc])continue;for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++){var vv=Math.abs(dr)===2||Math.abs(dc)===2||(dr===0&&dc===0);sm(rr+dr,cc+dc,vv);sr(rr+dr,cc+dc)}}
sm(sz-8,8,1);sr(sz-8,8);for(i=0;i<9;i++){if(i!==6){sr(8,i);sr(i,8)}}for(i=0;i<8;i++){sr(8,sz-1-i);sr(sz-1-i,8)}sr(8,sz-8);sr(sz-8,8);
var bi=0;function nb(){if(bi>=fb.length*8)return 0;var b=fb[bi>>3],bit=(b>>(7-(bi&7)))&1;bi++;return bit}
var up=true;for(var col=sz-1;col>0;col-=2){if(col===6)col--;for(var k=0;k<sz;k++){var row=up?sz-1-k:k;for(var cc=0;cc<2;cc++){var C=col-cc;if(!r[row][C])m[row][C]=nb()}}up=!up}
for(var rr=0;rr<sz;rr++)for(var cc=0;cc<sz;cc++)if(!r[rr][cc]&&(rr+cc)%2===0)m[rr][cc]^=1;
var fmt=0,d=fmt<<10,g=0x537;for(i=14;i>=10;i--)if((d>>i)&1)d^=g<<(i-10);fmt=((fmt<<10)|d)^0x5412;
var fbts=[];for(i=0;i<15;i++)fbts.push((fmt>>i)&1);
var p1=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
for(i=0;i<15;i++)m[p1[i][0]][p1[i][1]]=fbts[14-i];
for(i=0;i<15;i++){if(i<7)m[sz-1-i][8]=fbts[14-i];else m[8][sz-15+i]=fbts[14-i]}
return{m:m,sz:sz}}

const db=new Promise((ok,no)=>{const r=indexedDB.open('sys',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

 if(type==='PAYMENT'&&(!sid||!x||!(Number(x.amount)>0)||wasPaidToday(sid)))return null;
 const e=Object.assign({id:'EVT-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type,studentId:sid,timestamp:Date.now(),sessionDate:today(),undone:false},x||{});
 state.events.push(e);state.settings.maxT=Math.max(state.settings.maxT||0,e.timestamp);touch();save();return e}
const canUndo=e=>e&&!e.undone&&Date.now()-e.timestamp<=UNDO&&['CHECK_IN','PAYMENT'].includes(e.type);
function undoEvent(id){const e=state.events.find(x=>x.id===id);if(!e)return T.notFound;if(!canUndo(e))return T.expired;
 const cut=(o,note)=>{o.undone=true;addEvent(o.type+'_UNDONE',o.studentId,{amount:o.amount,originalId:o.id,sessionDate:o.sessionDate,note})};
 cut(e,'إلغاء');
 if(e.type==='CHECK_IN')state.events.filter(p=>p.type==='PAYMENT'&&p.studentId===e.studentId&&p.sessionDate===e.sessionDate&&!p.undone).forEach(p=>cut(p,'إلغاء تلقائي مع إلغاء الحضور'));
 touch();save();return''}
function wasPaidToday(id){return state.events.some(e=>e.type==='PAYMENT'&&e.studentId===id&&e.sessionDate===today()&&Number(e.amount)>0&&!e.undone)}

/* ===== Modal stack (رجوع / ✕ / الضغط خارج النافذة = خطوة واحدة للخلف) ===== */
const stack=[];let hist=true;
function show(){const t=stack[stack.length-1];if(!t){$('m').classList.remove('active');if(stream)resumeScan();return}if(stream)scanning=false;$('mBody').innerHTML=typeof t.r==='function'?t.r():t.r;$('m').classList.add('active');t.after&&t.after()}
function openM(r,cb,rep,after){const e={r,cb,after};if(rep&&stack.length){stack[stack.length-1]=e;try{history.replaceState({d:stack.length},'')}catch(x){}}else{stack.push(e);try{history.pushState({d:stack.length},'')}catch(x){hist=false}}show()}
function popTo(d){while(stack.length>d){const t=stack.pop();t.cb&&t.cb()}show()}
function back(n=1){n=Math.min(n,stack.length);if(n<1)return;if(hist)history.go(-n);else popTo(stack.length-n)}
const closeM=()=>back(1);
addEventListener('popstate',e=>{const d=(e.state&&e.state.d)||0;if(d>stack.length)return history.go(stack.length-d);popTo(d)});

H=ev.length?ev.map(e=>row(e.type.endsWith('UNDONE')?'r':e.type==='CHECK_IN'?'g':e.type==='PAYMENT'?'o':'b',e.type==='PAYMENT_UNDONE'?'↩️ تم إلغاء الدفع، المبلغ ('+fNum(e.amount)+' ج) أصبح صفرًا':(EVL[e.type]||e.type)+(e.amount?' ('+fNum(e.amount)+' ج)':''),fDate(e.sessionDate)+' — '+fTime(e.timestamp))).join(''):empty('لا توجد حركات')}
openM(X+`<h3 style="margin:0 0 12px">${T}: ${esc(s.name)}</h3><div style="max-height:400px;overflow-y:auto;text-align:right">${H}</div>`)}
async function delStudent(id){const s=getS(id);if(!s||!confirm('⚠️ حذف الطالب "'+s.name+'"؟'))return;if(!await askPwd('تأكيد الحذف'))return;
if(!confirm('🚨 تحذير: هذا الإجراء نهائي!\nسيتم حذف الطالب وكل سجلات حضوره ودفعه نهائيًا.\n\nهل تريد المتابعة؟'))return closeM();
state.events=state.events.filter(e=>e.studentId!==id);state.students=state.students.filter(x=>x.id!==id);
state.events.push({id:'EVT-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:'STUDENT_DELETE',studentId:null,timestamp:Date.now(),sessionDate:today(),undone:false,note:'حذف الطالب نهائيًا: '+s.name});
touch();save();refresh();back(2);toast('🗑️ تم حذف الطالب وكل سجلاته نهائيًا')}

/* ===== Import (validated) / PDF ===== */
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,.txt,application/json,text/plain';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.students))throw 0;
const ID=/^[\w-]{1,40}$/,DT=/^\d{4}-\d{2}-\d{2}$/,N=Number.isFinite,E=d.events||[];
const st=d.students.filter(s=>s&&ID.test(s.id)&&/^\d{11}$/.test(s.phone)&&typeof s.name==='string'&&s.name.length<=80).map(s=>({id:s.id,name:s.name,phone:s.phone,gender:s.gender==='girl'?'girl':'boy',qrColorId:Math.min(30,Math.max(1,parseInt(s.qrColorId)||1)),createdAt:N(s.createdAt)?s.createdAt:Date.now()}));
const ev=E.filter(e=>e&&ID.test(e.id)&&/^[A-Z_]{3,30}$/.test(e.type)&&(e.studentId==null||ID.test(e.studentId))&&N(e.timestamp)&&DT.test(e.sessionDate)&&(e.amount===undefined||(N(e.amount)&&e.amount>=0&&e.amount<=MAXAMT))).map(e=>({...e,note:typeof e.note==='string'?e.note.slice(0,100):'',undone:!!e.undone}));
const se=(d.sessions||[]).filter(s=>s&&DT.test(s.date)).map(s=>({date:s.date,startedAt:N(s.startedAt)?s.startedAt:0})),bad=d.students.length-st.length+E.length-ev.length;
if(!confirm(`📥 سيتم استبدال البيانات الحالية بـ ${st.length} طالب و${ev.length} حركة.${bad?'\n⚠️ تم تجاهل '+bad+' سجل غير صالح.':''}\nهل أنت متأكد؟`))return;
const S=d.settings||{};state={students:st,events:ev,sessions:se,settings:{lastExport:Date.now(),since:N(S.since)?S.since:Date.now(),maxT:Math.max(N(S.maxT)?S.maxT:0,state.settings.maxT||0)}};
_k=-1;save();refresh();back(99);checkLock();toast('✅ تم الاستيراد')}catch(x){toast('❌ ملف غير صالح')}};r.readAsText(f)};i.click()}
function printReport(title,sub,items,rows){const w=window.open('','_blank');if(!w)return toast('⚠️ فعّل النوافذ المنبثقة لتصدير PDF');
w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Tahoma,sans-serif;color:#000;padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#2c3e50;color:#fff}td,th{padding:6px;border:1px solid #ccc;text-align:center}.g{background:#f0f0f0;padding:12px;border-radius:8px;margin:15px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}</style></head><body><div style="text-align:center;border-bottom:3px solid #2c3e50;padding-bottom:10px"><h1 style="margin:0">📊 ${title}</h1>${sub}<p style="font-size:12px;color:#555">${new Date().toLocaleString('ar-EG-u-nu-latn')}</p></div><div class="g">${items.map(i=>`<div>${i[0]}: <b>${i[1]}</b></div>`).join('')}</div><table><tr><th>#</th><th>الاسم</th><th>الموبايل</th><th>حضور</th><th>غائب</th><th>النسبة</th><th>المدفوع</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.s.name)}</td><td>${esc(r.s.phone)}</td><td style="color:#27ae60">${r.att}</td><td style="color:#e74c3c">${r.miss}</td><td>${r.pct}%</td><td style="color:#e67e22">${fNum(r.paid)} ج</td></tr>`).join('')}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),500)}
const totals=r=>{const a=r.reduce((x,y)=>x+y.att,0),m=r.reduce((x,y)=>x+y.miss,0);return[a,m,a+m?Math.round(a/(a+m)*100):0,r.reduce((x,y)=>x+y.paid,0)]};
function exportPDF(){const rows=state.students.slice().sort((x,y)=>x.name.localeCompare(y.name,'ar')).map(s=>{const x=stats(s.id);return{s,att:x.att,miss:x.miss,pct:x.pct,paid:x.paid}}),t=totals(rows);
printReport('تقرير الطلاب','',[['👥 الطلاب',state.students.length],['📅 الحصص',sDates().length],['✅ الحضور',t[0]],['❌ الغياب',t[1]],['📈 النسبة',t[2]+'%'],['💰 المدفوعات',fNum(t[3])+' ج']],rows)}
function exportLastMonthPDF(){const n=new Date(),lm=new Date(n.getFullYear(),n.getMonth()-1,1),pre=lm.getFullYear()+'-'+String(lm.getMonth()+1).padStart(2,'0'),ds=sDates().filter(d=>d.startsWith(pre));idx();
const rows=state.students.map(s=>{const att=ds.filter(d=>_ci.has(s.id+'|'+d)).length;return{s,att,miss:ds.length-att,paid:sum((_pay[s.id]||[]).filter(e=>e.sessionDate.startsWith(pre))),pct:ds.length?Math.round(att/ds.length*100):0}}).filter(r=>r.att>0||r.paid>0).sort((a,b)=>b.att-a.att);
if(!rows.length)return toast('❌ لا توجد بيانات للشهر الماضي');const t=totals(rows);
printReport('تقرير الشهر الماضي','<h3 style="margin:5px 0">'+lm.toLocaleDateString('ar-EG-u-nu-latn',{month:'long',year:'numeric'})+'</h3>',[['📅 عدد الحصص',ds.length],['👥 الطلاب النشطون',rows.length],['✅ مجموع الحضور',t[0]],['❌ مجموع الغياب',t[1]],['📈 نسبة الحضور',t[2]+'%'],['💰 إجمالي المدفوعات',fNum(t[3])+' ج']],rows)}

if(!noSave&&!state.students.length&&!state.events.length){const first=!localStorage.getItem('welcomed_v3');localStorage.setItem('welcomed_v3','1');setTimeout(()=>openM(X+(first?'<h3>👋 أهلاً بك</h3><div style="text-align:right;line-height:2;font-size:14px"><p><b>1.</b> سجّل طلابك من الصفحة الرئيسية</p><p><b>2.</b> كل يوم جديد اضغط «ابدأ حصة»</p><p><b>3.</b> امسح QR الطالب أو استخدم «تسجيل سريع»</p><p><b>4.</b> ⚠️ خذ نسخة احتياطية كل شهر</p></div>':'<h3>⚠️ لا توجد بيانات</h3><p style="line-height:1.8;color:var(--tl)">لا توجد بيانات محفوظة على هذا الجهاز.<br>إن كانت لديك نسخة احتياطية فاستوردها الآن.</p>')+'<button class="btn green" style="margin:12px 0 8px" onclick="importData()">📥 استيراد نسخة احتياطية</button><button class="btn gray" onclick="closeM()">متابعة</button>'),500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkLock()});
themeMeta();document.addEventListener('pointerdown',unlockAudio);
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('🔄 تم تحديث التطبيق، أعد فتحه لتطبيق التحديث')})}})();
